services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env.local
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  # Optional: run Next.js in Docker for local production-like testing.
  # Prefer Vercel for the web app in production; keep worker always-on here.
  # web:
  #   build: .
  #   ports:
  #     - "3000:3000"
  #   env_file:
  #     - .env.local
  #   depends_on:
  #     - redis

volumes:
  redis_data:
